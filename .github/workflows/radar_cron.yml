name: Lomba IT Indonesia 24/7 Radar

on:
  schedule:
    # Berjalan otomatis setiap 15 menit selama 24 jam penuh
    - cron: "*/15 * * * *"
  workflow_dispatch: # Bisa juga dijalankan manual kapan saja lewat tombol "Run workflow"

permissions:
  contents: write

concurrency:
  group: radar-scan-group
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lomba IT Radar Scan & Send Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_AGE_DAYS: "30"
          DB_PATH: "data/radar_history.db"
        run: |
          python main.py --once

      - name: Persist Updated SQLite History Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "data/radar_history.db" ]; then
            sqlite3 data/radar_history.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi
          git add data/radar_history.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar): update seen competitions history [skip ci]"
            git push
          fi
